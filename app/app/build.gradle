apply plugin: 'com.android.application'

android {
    compileSdkVersion 26
    buildToolsVersion "28.0.3"
    defaultConfig {
        applicationId "tw.kibo.rpc.taiwan"
        minSdkVersion 24
        targetSdkVersion 26
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled  true
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
    }
    
    aaptOptions {
        noCompress "tflite"
    }

android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "taiwan.apk"
        }
    }
}

configurations {
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.httpclient'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.codec'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.io'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.lang'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.logging'
    all*.exclude group: 'org.apache.commons', module: 'com.springsource.org.apache.commons.net'
}

dependencies {
    implementation project(':guest_science_library')
    implementation project(':kibo_rpc_api')
        implementation 'com.android.support:appcompat-v7:26.+'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/com.springsource.org.apache.commons.codec-1.3.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.io-1.4.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.lang-2.4.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.httpclient-3.1.0.jar')
    implementation files('libs/com.springsource.org.apache.commons.logging-1.1.1.jar')
    implementation files('libs/com.springsource.org.apache.commons.net-2.0.0.jar')

    implementation('org.ros.rosjava_core:rosjava:[0.2,0.3)') {
        exclude group: 'xml-apis'
        exclude group: 'junit'
    }
    implementation('org.ros.android_core:android_10:[0.2,0.3)') {
        exclude group: 'xml-apis'
        exclude group: 'junit'
    }

    implementation 'com.quickbirdstudios:opencv-contrib:4.5.3.0'
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation ("org.tensorflow:tensorflow-lite-support:0.5.0")
}
